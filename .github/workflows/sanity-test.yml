name: Iris CI Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  iris-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install joblib scikit-learn matplotlib pytest flake8 black

    - name: Run Black Formatting Check
      run: black --check .




    - name: Run Tests
      run: pytest tests/

    - name: Train the model
      run: python3 src/train.py

    - name: Generate Confusion Matrix (Optional)
      run: python3 src/plot_metrics.py

    - name: Create CML Report
      uses: iterative/setup-cml@v2

    - name: Comment Results
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "## Iris Model CI Report" > report.md
        echo "![](metrics.png)" >> report.md
        cml comment create report.md
